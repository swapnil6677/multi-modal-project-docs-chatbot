<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PDF Viewer</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
    }
    iframe {
      width: 100%;
      height: 90vh;
      border: none;
    }
    h2 {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>PDF Viewer - Page {{ page }}</h2>

  <iframe src="/api/view-document?filename={{ filename }}&project_id={{ project_id }}#page={{ page }}"></iframe>
</body>
</html>
